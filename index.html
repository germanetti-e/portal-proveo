<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <title>Proveo | Centro de Abastecimiento Estratégico</title>

    <meta name="description"
        content="Proveo - Centro de Abastecimiento Estratégico para restaurantes, cafeterías, hoteles, panaderías y negocios." />

    <meta name="theme-color" content="#0B3558">

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="header">

        <div class="header-top">

            <button class="icon-button">

                <i class="fa-solid fa-bars"></i>

            </button>


            <img
                src="assets/logo/logo_proveo.png"
                alt="Proveo"
                class="logo">


            <button class="icon-button">

                <i class="fa-solid fa-cart-shopping"></i>

            </button>

        </div>

    </header>



    <!-- ========================= -->
    <!-- BUSCADOR -->
    <!-- ========================= -->

    <section class="search-section">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="¿Qué necesitas para tu negocio?"
                id="searchInput">

        </div>

    </section>



    <!-- ========================= -->
    <!-- BANNER -->
    <!-- ========================= -->

    <section class="hero">

        <img
            src="assets/banners/banner_home.png"
            alt="Banner Proveo">

    </section>



    <!-- ========================= -->
    <!-- MENSAJE -->
    <!-- ========================= -->

    <section class="welcome">

        <h1>

            Tu aliado estratégico para abastecer tu negocio de forma simple y confiable.

        </h1>

        <p>

            Entregas en la puerta de tu negocio.

        </p>

    </section>



    <!-- ========================= -->
    <!-- CATEGORÍAS -->
    <!-- ========================= -->

    <section class="categories">

        <h2>

            Categorías

        </h2>

        <div class="categories-grid">
